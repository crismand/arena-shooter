# Runs the EditMode and PlayMode test suites in Unity on GitHub's Linux runners (via GameCI).
# Needs the repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD (see README, "CI").
name: Tests

on:
  push:
    branches: [dev]
    # Docs-only pushes don't need a Unity run. (Not applied to pull requests: a required check
    # that never runs would block the merge.)
    paths-ignore: ['**.md', 'media/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Lets the release workflow run the same tests before building.
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write # the test runner publishes results as a check with annotations

jobs:
  test:
    name: Tests (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - testMode: editmode
            assembly: AS.Tests.EditMode
          - testMode: playmode
            assembly: AS.Tests.PlayMode
    steps:
      - name: Check out (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ is Unity's import cache. Restoring it turns a ~10 minute import into seconds.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.testMode }}
          # Only our tests: the manifest marks com.unity.inputsystem as testable (for its test
          # fixture), which would otherwise pull in the package's own test suite.
          customParameters: -assemblyNames ${{ matrix.assembly }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: ignore
