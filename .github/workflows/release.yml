# Pushing a version tag (v1.2.3) runs all tests, builds the Windows player and creates a DRAFT
# GitHub release with the zipped build attached. Review the notes on GitHub, then press Publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the zip
  checks: write   # the reused test workflow publishes check results

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-windows:
    name: Build Windows (64-bit)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The Unity editor image with Windows build support is large; make room for it.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out (with LFS and full history)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # versioning: Tagged reads the version with git describe

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      # Builds the scenes enabled in Build Settings. Product name, window and resolution
      # settings come from ProjectSettings (written by Editor/BuildScript.cs).
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ArenaShooter
          # Sets the player's version from the tag (v1.2.3 → 1.2.3).
          versioning: Tagged

      # Same layout as the v1.0.0 zip: one ArenaShooter/ folder, without Burst's debug symbols.
      - name: Zip
        id: zip
        run: |
          zip_name="ArenaShooter-${GITHUB_REF_NAME}-windows-x64.zip"
          mkdir -p staging/ArenaShooter
          sudo chown -R "$USER" build
          rsync -a --exclude='*_DoNotShip' build/StandaloneWindows64/ staging/ArenaShooter/
          (cd staging && zip -qr "../${zip_name}" ArenaShooter)
          ls -lh "${zip_name}"
          echo "name=${zip_name}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.zip.outputs.name }}

      # Creates a draft release for the tag, or replaces the zip on an existing release
      # (for example when re-running the workflow).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --draft --verify-tag \
              --title "Arena Shooter $GITHUB_REF_NAME" --generate-notes
          fi
