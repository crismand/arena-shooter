# PPO for the arena agent: the wiki's starting config, to tune from.
# Steps are agent decisions: one every 5 physics steps (the DecisionRequester), so 2M of them
# is about 55 hours of game time.
behaviors:
  ArenaAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      # Observations already come in at about -1..1.
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 200000
    keep_checkpoints: 5
